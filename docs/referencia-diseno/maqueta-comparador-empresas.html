<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicación mensual de liquidaciones — COES</title>
<style>
/* ===========================================================================
   Publicación mensual de liquidaciones (COES)
   Necesita maqueta_revisiones_datos.js en la misma carpeta: los dos archivos
   viajan juntos. No requiere servidor ni internet.
   =========================================================================== */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --surface-2:#f2f1ee; --surface-3:#eceae5;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --serie-1:#2a78d6; --serie-2:#eb6834; --serie-3:#1baf7a; --serie-4:#eda100;
  --pos:#2a78d6; --neg:#d03b3b;
  --warning:#fab219; --critical:#d03b3b; --good:#0ca30c;
  --radio:10px; --sombra:0 1px 2px rgba(11,11,11,.04),0 4px 12px rgba(11,11,11,.05);
  --fuente:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]){
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --surface-2:#232321; --surface-3:#2c2c2a;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --serie-1:#3987e5; --serie-2:#d95926; --serie-3:#199e70; --serie-4:#c98500;
  --pos:#3987e5; --neg:#e66767;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
}}
:root[data-tema="oscuro"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --surface-2:#232321; --surface-3:#2c2c2a;
  --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --serie-1:#3987e5; --serie-2:#d95926; --serie-3:#199e70; --serie-4:#c98500;
  --pos:#3987e5; --neg:#e66767;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--text-primary);
     font:14px/1.5 var(--fuente);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}

.cab{position:sticky;top:0;z-index:20;background:var(--surface-1);border-bottom:1px solid var(--border)}
.cab__fila{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.marca{display:flex;align-items:center;gap:11px;margin-right:auto}
.marca__logo{display:block;width:92px;height:auto;background:#fff;border-radius:8px;padding:6px 9px;
             border:1px solid var(--border);object-fit:contain;flex:none}
.marca strong{font-size:15px;display:block;line-height:1.2}
.marca span{font-size:12px;color:var(--text-muted)}
.ctrl{display:flex;align-items:center;gap:7px}
.ctrl label{font-size:12px;color:var(--text-secondary);font-weight:600}
select{padding:7px 10px;font:inherit;font-size:13px;color:var(--text-primary);
       background:var(--surface-1);border:1px solid var(--axis);border-radius:8px}
select:focus-visible,button:focus-visible{outline:2px solid var(--serie-1);outline-offset:2px}
.icono-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
           width:34px;height:34px;cursor:pointer;display:grid;place-items:center;color:inherit}
.icono-btn:hover{background:var(--grid)}

/* ------------------------------------------------- selector múltiple de empresas */
.ms{position:relative}
.ms__btn{display:flex;align-items:center;gap:8px;background:var(--surface-1);
         border:1px solid var(--axis);border-radius:8px;padding:7px 11px;cursor:pointer;
         font-size:13px;color:var(--text-primary);min-width:190px;text-align:left}
.ms__btn:hover{background:var(--surface-2)}
.ms__btn span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms__cnt{background:var(--surface-3);color:var(--text-secondary);border-radius:20px;
         padding:0 7px;font-size:11px;font-weight:700}
.ms__panel{position:absolute;top:calc(100% + 6px);right:0;z-index:40;width:290px;
           background:var(--surface-1);border:1px solid var(--border);border-radius:10px;
           box-shadow:0 8px 28px rgba(11,11,11,.16);padding:10px}
.ms__panel input[type=search]{width:100%;padding:7px 10px;font:inherit;font-size:13px;
  color:var(--text-primary);background:var(--surface-1);border:1px solid var(--axis);
  border-radius:7px;margin-bottom:8px}
.ms__acc{display:flex;gap:6px;margin-bottom:8px}
.ms__acc button{flex:1;background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;padding:5px;cursor:pointer;font-size:11.5px;font-weight:650;
  color:var(--text-secondary)}
.ms__acc button:hover{background:var(--grid);color:var(--text-primary)}
.ms__lista{max-height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.ms__it{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;
        cursor:pointer;font-size:12.5px}
.ms__it:hover{background:var(--surface-2)}
.ms__it input{margin:0;cursor:pointer;accent-color:var(--serie-1)}
main{padding:20px;max-width:1400px;margin:0 auto}

.aviso{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;
  background:color-mix(in srgb,var(--warning) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 35%,transparent);
  font-size:12.5px;color:var(--text-secondary);margin-bottom:18px}
.aviso svg{flex:none;margin-top:2px}
.aviso code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:11.5px}

.portada{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radio);
         padding:20px;box-shadow:var(--sombra);margin-bottom:22px}
.portada__et{font-size:12px;font-weight:700;color:var(--text-secondary);
             text-transform:uppercase;letter-spacing:.06em}
.portada__tit{font-size:27px;font-weight:680;letter-spacing:-.02em;margin:3px 0 14px}
.resumen{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.res{background:var(--surface-2);border-radius:9px;padding:13px 15px}
.res__et{font-size:11.5px;font-weight:700;color:var(--text-secondary);
         text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.res__val{font-size:21px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res__sub{font-size:12px;color:var(--text-muted);margin-top:4px}

.proc{margin-bottom:26px}
.proc__cab{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.proc__pt{width:11px;height:11px;border-radius:3px;flex:none}
.proc__nom{font-size:15px;font-weight:660}
.proc__meta{font-size:12px;color:var(--text-muted);margin-left:auto;
            font-variant-numeric:tabular-nums;text-align:right}
.proc__meta b{color:var(--text-secondary);font-weight:660}
.tarjetas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}

.t{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radio);
   padding:14px;box-shadow:var(--sombra);position:relative;cursor:pointer;
   transition:transform .08s,box-shadow .08s}
.t:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(11,11,11,.06),0 8px 20px rgba(11,11,11,.07)}
.t--r0{border-color:color-mix(in srgb,var(--acento) 45%,var(--border));
       background:linear-gradient(to bottom,color-mix(in srgb,var(--acento) 7%,var(--surface-1)),var(--surface-1) 58%)}
.t--sel{outline:2px solid var(--acento);outline-offset:1px}
.t__top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.t__mes{font-size:13.5px;font-weight:660;line-height:1.25}
.t__tipo{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.rev{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;flex:none;font-variant-numeric:tabular-nums}
.rev--r0{background:color-mix(in srgb,var(--acento) 18%,transparent);color:var(--acento)}
.rev--rn{background:var(--surface-3);color:var(--text-secondary)}
.t__monto{font-size:19.5px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:9px}
.t__var{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.t__pct{font-size:14px;font-weight:660;font-variant-numeric:tabular-nums}
.t__abs{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.sube::before{content:"▲ ";font-size:9px}
.baja::before{content:"▼ ";font-size:9px}
.signo{color:var(--critical)}
.signo::before{content:"↔ ";font-size:10px}
.t__base{font-size:11.5px;color:var(--text-muted);margin-top:6px}
.t__cadena{display:flex;gap:4px;margin-top:11px;align-items:center}
.pt{width:6px;height:6px;border-radius:50%;background:var(--axis)}
.pt--on{background:var(--acento);width:7px;height:7px}
.t__cadena span{font-size:10.5px;color:var(--text-muted);margin-left:3px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;
      font-size:10.5px;font-weight:700;margin-top:8px;margin-right:5px}
.chip--alta{background:color-mix(in srgb,var(--critical) 15%,transparent);color:var(--critical)}
.chip--real{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.t__pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px}
.t__ver{font-size:11px;color:var(--acento);font-weight:700;display:flex;align-items:center;gap:3px}
.t:hover .t__ver{text-decoration:underline}

.detalle{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--border);
         border-radius:var(--radio);padding:16px}
.detalle h3{font-size:13.5px;margin-bottom:3px}
.detalle p{margin:0 0 13px;font-size:12.5px;color:var(--text-secondary)}
.detalle h4{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;
            letter-spacing:.05em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.detalle h4 .n{background:var(--surface-3);color:var(--text-secondary);border-radius:20px;
               padding:1px 8px;font-size:10.5px}
.tabla-caja{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);
   font-weight:700;border-bottom:1px solid var(--axis)}
td{border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
tr.actual td{font-weight:700;background:var(--surface-3)}
.grupo-val{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.barra{display:inline-block;height:7px;border-radius:4px;vertical-align:middle;min-width:2px}
.nota{font-size:12px;color:var(--text-muted);background:var(--surface-1);border:1px solid var(--border);
      border-radius:8px;padding:9px 12px;margin:6px 0 12px;line-height:1.55}

/* ---------------------------------------------- vista de análisis detallado */
.volver{display:inline-flex;align-items:center;gap:6px;background:var(--surface-1);
        border:1px solid var(--border);border-radius:8px;padding:7px 13px;cursor:pointer;
        font-weight:600;font-size:12.5px;color:var(--text-secondary)}
.volver:hover{background:var(--surface-2);color:var(--text-primary)}
.miga{font-size:12px;color:var(--text-muted);margin:14px 0 10px}
.miga b{color:var(--text-secondary);font-weight:640}
.enc{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radio);
     padding:20px;box-shadow:var(--sombra);margin-bottom:20px;border-left:4px solid var(--acento)}
.enc__tit{font-size:12px;font-weight:700;color:var(--text-secondary);
          text-transform:uppercase;letter-spacing:.06em}
.enc__mes{font-size:25px;font-weight:680;letter-spacing:-.02em;margin:3px 0 16px}
.enc__cifras{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cif__et{font-size:11.5px;font-weight:700;color:var(--text-muted);
         text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.cif__val{font-size:22px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cif__sub{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.bloque{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radio);
        padding:18px;box-shadow:var(--sombra);margin-bottom:18px}
.bloque>h3{font-size:14px;margin-bottom:3px}
.bloque>p{margin:0 0 14px;font-size:12.5px;color:var(--text-secondary)}
.bloque h4{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;
           letter-spacing:.05em;margin:20px 0 9px;display:flex;align-items:center;gap:8px}
.bloque h4 .n{background:var(--surface-2);color:var(--text-secondary);border-radius:20px;
              padding:1px 8px;font-size:10.5px;font-weight:700}
.graf{width:100%;display:block;overflow:visible;margin:4px 0 16px}
.graf text{font-family:var(--fuente)}
.vacio{padding:34px 16px;text-align:center;color:var(--text-muted);line-height:1.7}
.pie{padding:24px 20px 44px;text-align:center;color:var(--text-muted);font-size:12px;max-width:1400px;margin:0 auto}
@media(max-width:620px){.portada__tit{font-size:22px}.ctrl{flex:1 1 100%}.ctrl select{flex:1}}
</style>
</head>

<script>
/* =========================================================================
   CONFIGURACIÓN — lo editable
   ========================================================================= */
const COLOR_PROC = { 'LVTA':'--serie-1', 'LVTP':'--serie-2',
                     'LSCIO':'--serie-3', 'SST-SCT':'--serie-4' };

/* Una revisión que mueve ≥10% el monto ya publicado es una alarma; que un mes
   varíe 25% contra el anterior es normal. De ahí dos umbrales distintos. */
const UMBRAL = { r0:25, revision:10, montoMinimo:1000 };

/* =========================================================================
   DATOS — los inyecta maqueta_revisiones_datos.js
   ========================================================================= */
let D = null, IDX = null, IDXV = null, IDXC = null, IDXF = null, PER = {};
window.__REVISIONES__ = (obj) => { D = obj; arrancar(); };

/* Todos los índices se construyen sumando sobre las empresas seleccionadas.
   Con una sola empresa el resultado es idéntico al de antes; con varias, los
   montos se agregan. El calendario de publicación es de mercado, así que no
   depende de la selección. */

/* IDX[proceso][pericodi][revision] = { pub, monto }  (total del proceso) */
function indexar(empresas){
  const out = {};
  for(const emp of empresas){
    const datos = D.datos[emp] || {};
    for(const proc in datos){
      out[proc] = out[proc] || {};
      for(const [peri, rev, pub, monto] of datos[proc]){
        const p = (out[proc][peri] = out[proc][peri] || {});
        if(p[rev]) p[rev].monto += monto;
        else p[rev] = { pub, monto };
      }
    }
  }
  return out;
}

/* IDXV[proceso][pericodi][revision][val_idx] = monto  (por valorización, para
   escalar el detalle de concepto a cualquier revisión) */
function indexarValorizaciones(empresas){
  const out = {};
  for(const emp of empresas){
    const val = D.valorizaciones[emp] || {};
    for(const proc in val){
      out[proc] = out[proc] || {};
      for(const [pc, rev, vi, monto] of val[proc]){
        const p = (out[proc][pc] = out[proc][pc] || {});
        const q = (p[rev] = p[rev] || {});
        q[vi] = (q[vi] || 0) + monto;
      }
    }
  }
  return out;
}

/* IDXC[proceso][pericodi] = [[val_idx, con_idx, monto], ...]  (detalle por concepto) */
function indexarConceptos(empresas){
  const acc = {};
  for(const emp of empresas){
    const porProc = D.detalle_conceptos[emp] || {};
    for(const proc in porProc){
      acc[proc] = acc[proc] || {};
      for(const pc in porProc[proc]){
        const m = (acc[proc][pc] = acc[proc][pc] || {});
        for(const [vi, ci, monto] of porProc[proc][pc]){
          const k = vi + '|' + ci;
          m[k] = (m[k] || 0) + monto;
        }
      }
    }
  }
  const out = {};
  for(const proc in acc){
    out[proc] = {};
    for(const pc in acc[proc]){
      out[proc][pc] = Object.keys(acc[proc][pc]).map(k=>{
        const [vi, ci] = k.split('|').map(Number);
        return [vi, ci, acc[proc][pc][k]];
      });
    }
  }
  return out;
}

/* IDXF[tipo][pericodi] = [[...clave, monto], ...]  (componentes físicos) */
function indexarFisico(empresas){
  const out = { fisico_entregas:{}, fisico_retiros:{} };
  for(const tipo of ['fisico_entregas','fisico_retiros']){
    const acc = {};
    for(const emp of empresas){
      const porPc = (D[tipo]||{})[emp] || {};
      for(const pc in porPc){
        const m = (acc[pc] = acc[pc] || {});
        for(const fila of porPc[pc]){
          const k = fila.slice(0, -1).join('|');
          m[k] = (m[k] || 0) + fila[fila.length-1];
        }
      }
    }
    for(const pc in acc){
      out[tipo][pc] = Object.keys(acc[pc]).map(k=>{
        const partes = k.split('|').map(x => isNaN(+x) ? x : +x);
        return partes.concat([acc[pc][k]]);
      });
    }
  }
  return out;
}

/* Reconstruye todos los índices para la selección actual. */
function reindexar(){
  const emps = estado.empresas;
  IDX  = indexar(emps);
  IDXV = indexarValorizaciones(emps);
  IDXC = indexarConceptos(emps);
  IDXF = indexarFisico(emps);
}

/* =========================================================================
   FORMATO
   ========================================================================= */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto',
             'Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const mesLargo = pc => { const p=PER[pc]; return p ? `${MESES[+p.clave.slice(4,6)-1]} ${p.clave.slice(0,4)}` : '—'; };
const mesCorto = pc => { const p=PER[pc]; return p ? `${MESES_C[+p.clave.slice(4,6)-1]} ${p.clave.slice(2,4)}` : '—'; };

const nfS=new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('es-PE',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('es-PE',{minimumFractionDigits:1,maximumFractionDigits:1});
const soles=v=>(v==null||!isFinite(v))?'—':nfS.format(v);
function solesCorto(v){
  if(v==null||!isFinite(v))return '—';
  const s=v<0?'−':'', a=Math.abs(v);
  if(a>=1e6)return `${s}S/ ${nf1.format(a/1e6)} M`;
  if(a>=1e3)return `${s}S/ ${nf0.format(a/1e3)} k`;
  return `${s}S/ ${nf0.format(a)}`;
}
const pct=v=>`${v>=0?'+':'−'}${nf1.format(Math.abs(v))}%`;

/* El % se oculta cuando es correcto pero engañoso (mismo criterio del portal). */
function variacion(monto, base){
  if(base==null) return { delta:null, deltaPct:null, nota:'sin periodo de comparación' };
  const delta = monto - base;
  if(Math.abs(base)<0.005) return { delta, deltaPct:null, nota:'el periodo base es cero' };
  if((monto>0&&base<0)||(monto<0&&base>0))
    return { delta, deltaPct:null, cambioSigno:true,
             nota:`cambió de ${base>0?'a favor':'en contra'} a ${monto>0?'a favor':'en contra'}` };
  const p = delta/Math.abs(base)*100;
  if(Math.abs(p)>999) return { delta, deltaPct:p, fueraRango:true, nota:'variación fuera de rango' };
  return { delta, deltaPct:p };
}
const esFuerte = it => {
  if(Math.abs(it.monto)<UMBRAL.montoMinimo) return false;
  if(it.cambioSigno||it.fueraRango) return true;
  if(it.deltaPct==null) return false;
  return Math.abs(it.deltaPct) >= (it.rev===0 ? UMBRAL.r0 : UMBRAL.revision);
};

/* =========================================================================
   CONTENIDO DE UNA PUBLICACIÓN
   ========================================================================= */
function contenido(proc, pub){
  const porPeri = IDX[proc] || {}, items = [];
  for(const peri in porPeri){
    const pc = +peri;
    for(const rev in porPeri[pc]){
      const r = +rev, e = porPeri[pc][r];
      if(e.pub !== pub) continue;                 // no sale en esta publicación
      /* basePc/baseRev identifican EXACTAMENTE contra qué se compara, para que
         el drill-down pueda reconstruir el mismo par (periodo, revisión). */
      let base=null, baseEt='', basePc=null, baseRev=null;
      if(r === 0){
        /* R0 → última revisión del mes anterior conocida a esta fecha */
        const ant = porPeri[pc-1];
        if(ant){
          let mejor=-1;
          for(const rr in ant) if(ant[rr].pub <= pub && +rr > mejor) mejor = +rr;
          if(mejor >= 0){ base = ant[mejor].monto; baseEt = `${mesLargo(pc-1)} · R${mejor}`;
                          basePc = pc-1; baseRev = mejor; }
        }
      } else {
        const prev = porPeri[pc][r-1];
        if(prev){ base = prev.monto; baseEt = `${mesLargo(pc)} · R${r-1}`;
                  basePc = pc; baseRev = r-1; }
      }
      /* Cuántas revisiones llega a tener este mes DEPENDE DEL PROCESO: un mes
         puede llegar a R2 en Energía Activa y sólo a R1 en Potencia. */
      const rmax = ((D.rmax_proc||{})[proc]||{})[pc];
      const rm = (rmax===undefined) ? r : rmax;
      items.push({ pc, rev:r, monto:e.monto, base, baseEt, basePc, baseRev, rmax:rm,
                   esReal: r===rm && PER[pc] && PER[pc].origen==='real',
                   ...variacion(e.monto, base) });
    }
  }
  return items.sort((a,b)=> b.pc - a.pc);
}

/* =========================================================================
   COMPONENTES DE UNA LIQUIDACIÓN  (el drill-down)

   Dos naturalezas distintas según el proceso:

   · Energía Activa no tiene desglose financiero — una sola fila "Liquidación
     Mensual". Lo que explica el monto es la ENERGÍA FÍSICA: qué entregó por
     punto y qué retiraron sus clientes. Esa medición no se revisa, así que la
     comparación siempre es de mes calendario contra mes calendario.

   · Potencia, LSCIO y SST-SCT sí tienen desglose. El dataset trae el detalle
     por CONCEPTO (línea de transmisión, mecanismo específico) para cada mes.
     Ese detalle es el ancla de la última revisión; para verlo en cualquier
     otra revisión se escala por el factor que ya se calculó a nivel de
     valorización:  factor = monto_valorización(r) / monto_valorización(rmax).
     Así la suma de los conceptos sigue cuadrando con el total en toda la cadena.
   ========================================================================= */

function factorEnRevision(proc, pc, rev, vi){
  const rm = ((D.rmax_proc||{})[proc]||{})[pc];
  if(rm === undefined) return null;
  const cadena = (IDXV[proc]||{})[pc] || {};
  const enRev  = (cadena[rev]||{})[vi];
  const enRmax = (cadena[rm]||{})[vi];
  if(enRev==null || enRmax==null || Math.abs(enRmax) < 0.005) return null;
  return enRev / enRmax;
}

/* Componentes de (proceso, periodo) llevados a una revisión concreta.

   Si el proceso tiene detalle por concepto (Potencia, LSCIO, SST-SCT) se baja
   hasta ahí. Energía Activa no lo tiene — sus componentes SON sus tres
   valorizaciones (Entregas, Retiros, Ingreso Tarifario/RC) — así que en ese
   caso se devuelve el nivel de valorización directamente. */
function listaConceptos(proc, pc, rev){
  const ancla = (IDXC[proc]||{})[pc];

  if(!ancla){                                   // sin detalle → nivel valorización
    const porRev = ((IDXV[proc]||{})[pc]||{})[rev];
    if(!porRev) return null;
    return Object.keys(porRev).map(vi=>({
      id: 'v'+vi, etiqueta: D.tabla_valorizaciones[vi], monto: porRev[vi] }));
  }

  const acc = {};
  for(const [vi, ci, monto] of ancla){
    const f = factorEnRevision(proc, pc, rev, vi);
    const k = vi + '|' + ci;
    acc[k] = (acc[k]||0) + (f==null ? monto : monto*f);
  }
  return Object.keys(acc).map(k=>{
    const [vi, ci] = k.split('|').map(Number);
    return { id:k, etiqueta: D.tabla_conceptos[ci],
             grupo: D.tabla_valorizaciones[vi], monto: acc[k] };
  });
}

function listaEntregas(pc){
  const filas = IDXF.fisico_entregas[pc];
  if(!filas || !filas.length) return null;
  return filas.map(([codent, monto]) => ({
    id: 'e'+codent, etiqueta: D.tabla_puntos[codent] || ('Punto '+codent), monto }));
}
function listaRetiros(pc){
  const filas = IDXF.fisico_retiros[pc];
  if(!filas || !filas.length) return null;
  return filas.map(([cliente, barr, monto]) => ({
    id: cliente+'|'+barr,
    etiqueta: cliente + ' — ' + (D.tabla_barras[barr] || ('Barra '+barr)), monto }));
}

/* Une dos listas por id y ordena por IMPACTO: manda la variación absoluta en
   Soles (o en MWh), no el porcentaje — un +900% sobre S/ 3 no es noticia. */
function filasComparadas(listaA, listaB){
  const mapA = new Map((listaA||[]).map(x=>[x.id,x]));
  const mapB = new Map((listaB||[]).map(x=>[x.id,x]));
  const ids = new Set([...mapA.keys(), ...mapB.keys()]);
  const filas = [...ids].map(id=>{
    const a = mapA.get(id), b = mapB.get(id), ref = a||b;
    const actual = a ? a.monto : null, previo = b ? b.monto : null;
    const delta = (actual!=null && previo!=null) ? actual-previo : null;
    return { etiqueta: ref.etiqueta, grupo: ref.grupo, actual, previo, delta,
             pctv: (previo!=null && Math.abs(previo)>0.0001 && delta!=null)
                   ? delta/Math.abs(previo)*100 : null };
  });
  const hayDelta = filas.some(f=>f.delta!=null);
  filas.sort((x,y)=> hayDelta
    ? Math.abs(y.delta||0) - Math.abs(x.delta||0)
    : Math.abs(y.actual!=null?y.actual:(y.previo||0)) - Math.abs(x.actual!=null?x.actual:(x.previo||0)));
  return filas;
}

/* Gráfico de impacto: barras divergentes horizontales con la variación de cada
   componente. Un solo eje, cero al centro, azul a favor / rojo en contra, y
   etiqueta directa al final de cada barra. Responde de un vistazo la pregunta
   "¿cuál lo movió?". */
function graficoImpacto(filas, unidad, tope){
  const datos = filas.filter(f=>f.delta!=null && Math.abs(f.delta)>0.005).slice(0, tope||10);
  if(datos.length < 2) return '';
  const fmt = unidad==='MWh'
    ? v => nf1.format(v)+' MWh'
    : v => solesCorto(v);

  const W=900, filaH=26, M={t:22,r:16,b:10,l:300};
  const H = M.t + M.b + datos.length*filaH;
  const max = Math.max.apply(null, datos.map(f=>Math.abs(f.delta)));
  const iw = W - M.l - M.r;
  const x0 = M.l + iw/2;                       // el cero, al centro
  const esc = (iw/2 - 74) / (max||1);          // deja sitio a la etiqueta

  let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Variación por componente, ordenada por impacto">
    <line x1="${x0}" x2="${x0}" y1="${M.t-8}" y2="${H-M.b}" stroke="var(--axis)" stroke-width="1.5"/>
    <text x="${x0}" y="${M.t-12}" text-anchor="middle" font-size="10"
          fill="var(--text-muted)" font-weight="600">0</text>`;

  datos.forEach((f,i)=>{
    const y = M.t + i*filaH, h = 14, yb = y + (filaH-h)/2;
    const w = Math.max(Math.abs(f.delta)*esc, 1.5);
    const pos = f.delta >= 0;
    const x = pos ? x0 : x0 - w;
    const col = pos ? 'var(--pos)' : 'var(--neg)';
    const r = Math.min(4, w/2);
    // extremo de dato redondeado, anclado al cero
    const d = pos
      ? `M${x} ${yb}h${w-r}a${r} ${r} 0 0 1 ${r} ${r}v${h-2*r}a${r} ${r} 0 0 1 ${-r} ${r}h${-(w-r)}Z`
      : `M${x0} ${yb}h${-(w-r)}a${r} ${r} 0 0 0 ${-r} ${r}v${h-2*r}a${r} ${r} 0 0 0 ${r} ${r}h${w-r}Z`;
    const nombre = f.etiqueta.length>44 ? f.etiqueta.slice(0,43)+'…' : f.etiqueta;
    s += `<path d="${d}" fill="${col}"><title>${esc2(f.etiqueta)}: ${esc2(fmt(f.delta))}</title></path>
      <text x="${M.l-12}" y="${y+filaH/2+4}" text-anchor="end" font-size="11.5"
            fill="var(--text-secondary)">${esc2(nombre)}</text>
      <text x="${pos ? x+w+8 : x-8}" y="${y+filaH/2+4}" text-anchor="${pos?'start':'end'}"
            font-size="11.5" font-weight="660" fill="${col}"
            style="font-variant-numeric:tabular-nums">${esc2(fmt(f.delta))}</text>`;
  });
  return s + '</svg>';
}
const esc2 = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tablaComponentes(filas, col1, unidad, etA, etB){
  if(!filas.length) return '<div class="nota">Sin componentes que mostrar.</div>';
  const fmt = unidad==='MWh'
    ? v => (v==null||!isFinite(v)) ? '—' : nf1.format(v)+' MWh'
    : v => (v==null) ? '—' : soles(v);
  const peso = f => Math.abs(f.delta!=null ? f.delta : (f.actual||0));
  const maxAbs = Math.max.apply(null, filas.map(peso).concat([1e-9]));
  const movidas = filas.filter(f=>Math.abs(f.delta||0) > 0.005).length;
  const cuerpo = filas.map(f=>`<tr>
      <td>${esc(f.etiqueta)}${f.grupo?`<div class="grupo-val">${esc(f.grupo)}</div>`:''}</td>
      <td>${fmt(f.previo)}</td>
      <td>${fmt(f.actual)}</td>
      <td>${f.delta==null?'—':fmt(f.delta)}</td>
      <td>${f.pctv==null?'—':pct(f.pctv)}</td>
      <td><span class="barra" style="width:${(peso(f)/maxAbs*70).toFixed(1)}px;
           background:${(f.delta!=null?f.delta:(f.actual||0))>=0?'var(--pos)':'var(--neg)'}"></span></td>
    </tr>`).join('');
  return `<p style="margin:-4px 0 10px">${movidas} de ${filas.length} componente(s) con variación,
      ordenados por impacto${unidad==='MWh'?' en energía':' en Soles'}.</p>
    ${graficoImpacto(filas, unidad)}
    <div class="tabla-caja"><table><thead><tr>
      <th>${esc(col1)}</th><th>${esc(etB||'Base')}</th><th>${esc(etA||'Actual')}</th>
      <th>Δ</th><th>Δ %</th><th>peso</th></tr></thead><tbody>${cuerpo}</tbody></table></div>`;
}

/* Potencia / LSCIO / SST-SCT → desglose financiero por concepto */
function panelConceptosHTML(proc, it){
  const A = listaConceptos(proc, it.pc, it.rev);
  const titulo = it.rev===0
    ? `Componentes de la liquidación · ${esc(mesLargo(it.pc))} R0 vs ${esc(it.baseEt||'—')}`
    : `Origen del recálculo · R${it.baseRev} → R${it.rev} de ${esc(mesLargo(it.pc))}`;
  if(!A) return `<h4>${titulo}</h4>
    <div class="nota">Sin desglose disponible para ${esc(mesLargo(it.pc))} en este proceso.</div>`;
  const B = (it.basePc!=null) ? listaConceptos(proc, it.basePc, it.baseRev) : null;
  const filas = filasComparadas(A, B);
  return `<h4>${titulo}<span class="n">${filas.length} conceptos</span></h4>` +
    tablaComponentes(filas, 'Valorización y concepto', 'S/',
                     `R${it.rev}`, it.basePc!=null ? `R${it.baseRev}` : 'Base');
}

/* Último periodo <= pc con medición disponible para la selección actual. */
function ultimoConFisico(tipo, pc){
  const m = IDXF[tipo] || {};
  for(let p = pc; p >= pc - 24; p--) if(m[p] && m[p].length) return p;
  return null;
}

/* Un bloque físico (entregas o retiros), resolviendo por su cuenta qué meses
   tienen medición disponible. */
function bloqueFisico(tipo, pcTarjeta, titulo, col1, sinDatos){
  const pcA = ultimoConFisico(tipo, pcTarjeta);
  if(pcA === null) return `<h4 style="margin-top:18px">${titulo}</h4>${sinDatos}`;

  let aviso = '';
  if(pcA !== pcTarjeta){
    aviso = `<div class="nota">Última medición disponible: <b>${esc(mesLargo(pcA))}</b>.</div>`;
  }
  const lista = tipo === 'fisico_entregas' ? listaEntregas : listaRetiros;
  const pcB = ultimoConFisico(tipo, pcA - 1);
  const filas = filasComparadas(lista(pcA), pcB === null ? null : lista(pcB));

  return `<h4 style="margin-top:18px">${titulo}<span class="n">${filas.length}</span></h4>` + aviso +
    tablaComponentes(filas, col1, 'MWh', mesCorto(pcA), pcB===null ? 'Base' : mesCorto(pcB));
}

/* Energía Activa → el respaldo físico, DEBAJO de la descomposición monetaria */
function panelFisicoHTML(it){
  let html = `<h4 style="margin-top:26px">Respaldo físico · energía medida
      <span class="n">MWh</span></h4>
    <p style="margin:-4px 0 10px">De dónde sale la valorización: la energía inyectada al sistema
      y la retirada por los clientes.
      ${it.rev > 0
        ? 'Al tratarse de un recálculo del mismo mes, la medición no varía — lo que cambia es su valorización.'
        : ''}</p>`;

  html += bloqueFisico('fisico_entregas', it.pc, 'Entregas por punto', 'Punto de entrega',
    `<div class="nota">Sin puntos de entrega asociados a la selección actual.</div>`);

  html += bloqueFisico('fisico_retiros', it.pc, 'Retiros por cliente', 'Cliente — barra de retiro',
    `<div class="nota">Sin detalle de retiros por cliente para la selección actual.</div>`);
  return html;
}

/* ============================ VISTA DE ANÁLISIS DETALLADO ============================
   Pantalla propia, a ancho completo. El análisis necesita espacio — gráficos,
   varias tablas — y embutirlo entre las tarjetas lo dejaba sin aire. */
function renderDetalle(){
  const app = $('#app');

  // se recupera la tarjeta exacta desde la publicación, para no duplicar lógica

  const enc = el('div','enc');

  enc.innerHTML =

     <div class="enc__mes">${esc(mesLargo(pc))} <span style="color:${acento}">R${rev}</span></div>
     <div class="enc__cifras">
       <div><div class="cif__et">Monto de esta revisión</div>
         <div class="cif__val" style="color:${it.monto>=0?'var(--pos)':'var(--neg)'}">${soles(it.monto)}</div>
         <div class="cif__sub">${it.rev===0?'Liquidación mensual':'Revisión '+String(it.rev).padStart(2,'0')}</div></div>
       <div><div class="cif__et">Se compara contra</div>
         <div class="cif__val" style="color:var(--text-secondary)">${it.base==null?'—':soles(it.base)}</div>
         <div class="cif__sub">${esc(it.baseEt||'sin comparación')}</div></div>
       <div><div class="cif__et">Variación</div>
         <div class="cif__val" style="color:${(vr.delta||0)>=0?'var(--pos)':'var(--neg)'}">

  const b1 = el('div','bloque');

  app.appendChild(b1);

  // ---- historial de revisiones del mes
  app.appendChild(historialHTML(proc, it));
}

/* Historial completo de revisiones del mes liquidado */
function historialHTML(proc, it){
  const d = el('div','bloque');
  const porPeri = IDX[proc][it.pc] || {};
  const revs = Object.keys(porPeri).map(Number).sort((a,b)=>a-b);

  d.appendChild(el('h3',null,`Historial de revisiones de ${mesLargo(it.pc)}`));
  d.appendChild(el('p',null,
    `Todas las versiones publicadas de este mes liquidado y su efecto acumulado.`));

  const filasRev = revs.map(r=>{
    const e=porPeri[r], ant = r>0 ? porPeri[r-1] : null;
    const v = ant ? variacion(e.monto, ant.monto) : {delta:null,deltaPct:null};
    const futura = e.pub > estado.pub;
    const real = r===it.rmax && PER[it.pc] && PER[it.pc].origen==='real';
    return `<tr class="${r===it.rev?'actual':''}"${futura?' style="opacity:.42"':''}>
      <td>R${r}${r===it.rev?' ◀ en esta publicación':''}
          ${real?' <span class="chip chip--real" style="margin:0">✓ real</span>':''}
          ${futura?' <span style="color:var(--text-muted)">(aún no publicada)</span>':''}</td>
      <td>${mesCorto(e.pub)}</td>
      <td>${soles(e.monto)}</td>
      <td>${ant==null?'—':soles(v.delta)}</td>
      <td>${v.deltaPct==null?'—':pct(v.deltaPct)}</td></tr>`;
  }).join('');
  d.insertAdjacentHTML('beforeend',
    `<div class="tabla-caja"><table><thead><tr><th>Revisión</th><th>Sale en</th>
       <th>Monto restatado</th><th>Δ vs versión previa</th><th>Δ %</th></tr></thead>
       <tbody>${filasRev}</tbody></table></div>`);
  return d;
}

       <span class="t__tipo">${b.items.length} liquidación(es)</span>
       <span class="proc__meta">mes en curso <b>${solesCorto(totalR0)}</b>
         &nbsp;·&nbsp; recálculos <b>${solesCorto(dRev)}</b></span>`));
    const cont = el('div','tarjetas');
    b.items.forEach(function(it){ cont.appendChild(tarjeta(b.proc.id, it)); });
    sec.appendChild(cont);
    app.appendChild(sec);
  });
}

/* ------------------------------------------- selector múltiple de empresas */
function textoSeleccion(){
  const n = estado.empresas.length;
  if(n === D.empresas.length) return 'Todas';
  if(n === 0) return 'Ninguna';
  if(n === 1) return estado.empresas[0];
  return `${n} empresas`;
}

function pintarSeleccion(){
  $('#msTexto').textContent = textoSeleccion();
  $('#msCnt').textContent = estado.empresas.length;
  $('#subMarca').textContent = estado.empresas.length === D.empresas.length
    ? 'COES · vista de mercado'
    : `COES · ${textoSeleccion()}`;
}

function listaEmpresasHTML(filtro){
  const f = (filtro||'').trim().toUpperCase();
  const sel = new Set(estado.empresas);
  return D.empresas
    .filter(e => !f || e.toUpperCase().includes(f))
    .map(e => `<label class="ms__it">
        <input type="checkbox" value="${e}"${sel.has(e)?' checked':''}>${e}</label>`)
    .join('') || '<div class="nota" style="margin:0">Sin coincidencias.</div>';
}

function aplicarSeleccion(){
  reindexar();
  pintarSeleccion();
  estado.vista = 'lista'; estado.det = null;
  render();
}

function montarSelector(){
  const panel = $('#msPanel'), lista = $('#msLista');
  lista.innerHTML = listaEmpresasHTML('');

  $('#msBtn').onclick = (ev) => {
    ev.stopPropagation();
    const abierto = !panel.hidden;
    panel.hidden = abierto;
    $('#msBtn').setAttribute('aria-expanded', String(!abierto));
    if(!abierto) $('#msBuscar').focus();
  };
  panel.onclick = ev => ev.stopPropagation();
  document.addEventListener('click', () => {
    if(!panel.hidden){ panel.hidden = true; $('#msBtn').setAttribute('aria-expanded','false'); }
  });

  $('#msBuscar').oninput = e => { lista.innerHTML = listaEmpresasHTML(e.target.value); };

  lista.onchange = e => {
    if(e.target.type !== 'checkbox') return;
    const v = e.target.value, s = new Set(estado.empresas);
    e.target.checked ? s.add(v) : s.delete(v);
    estado.empresas = D.empresas.filter(x => s.has(x));
    aplicarSeleccion();
  };
  $('#msTodas').onclick = () => {
    estado.empresas = D.empresas.slice();
    lista.innerHTML = listaEmpresasHTML($('#msBuscar').value);
    aplicarSeleccion();
  };
  $('#msNinguna').onclick = () => {
    estado.empresas = [];
    lista.innerHTML = listaEmpresasHTML($('#msBuscar').value);
    aplicarSeleccion();
  };
}

function arrancar(){
  D.periodos.forEach(p => PER[p.pericodi] = p);
  estado.empresas = D.empresas.slice(0, 1);   // arranca con la primera empresa
  estado.pub = D.periodos[D.periodos.length-1].pericodi;
  reindexar();

  $('#selPub').innerHTML = D.periodos.slice().reverse()
    .map(p=>`<option value="${p.pericodi}">${mesLargo(p.pericodi)}</option>`).join('');
  $('#selPub').value = estado.pub;
  $('#selPub').onchange = e => { estado.pub=+e.target.value;
                                 estado.vista='lista'; estado.det=null; render(); };

  $('#btnTema').onclick = () => { const r=document.documentElement;
    r.setAttribute('data-tema',
      getComputedStyle(r).getPropertyValue('--plane').trim()==='#0d0d0d'?'claro':'oscuro'); };

  montarSelector();
  pintarSeleccion();
  render();
}
